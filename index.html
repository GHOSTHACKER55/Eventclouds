<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Clouds | PREMIUM STORE 👑</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#fff;margin:0;padding-bottom:100px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(15px);z-index:1000}
.active-modal{display:flex;align-items:center;justify-content:center}
.portal-card{background:#fff;border-radius:40px;padding:35px;width:95%;max-width:420px;color:#000}
.nav-card{box-shadow:0 -10px 40px rgba(0,0,0,0.5);background:#111;border-top:1px solid #222}
</style>
</head>
<body>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
<div class="portal-card">
<h2 id="auth-title" class="text-xl font-black uppercase mb-4">Create Account</h2>
<div id="signup-fields" class="space-y-3">
<input type="text" id="reg-name" placeholder="FULL NAME" class="w-full p-3 bg-gray-100 rounded-xl text-sm">
<input type="text" id="reg-phone" placeholder="WHATSAPP NUMBER" class="w-full p-3 bg-gray-100 rounded-xl text-sm">
</div>
<input type="email" id="auth-email" placeholder="EMAIL" class="w-full p-3 bg-gray-100 rounded-xl text-sm mt-3">
<input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full p-3 bg-gray-100 rounded-xl text-sm mt-3">

<button onclick="handleAuth()" id="auth-btn"
class="w-full bg-black text-white py-3 rounded-xl font-bold mt-4 text-sm">Register</button>

<p onclick="toggleMode()" class="text-xs mt-4 text-center cursor-pointer opacity-60">Already have account? Login</p>
<button onclick="closeModal('authModal')" class="w-full text-xs opacity-40 mt-3">Cancel</button>
</div>
</div>

<header class="p-6 flex justify-between items-center bg-black">
<h1 class="font-black text-lg">Event Clouds 👑</h1>
<div id="user-display" class="text-xs opacity-60">Guest</div>
<button onclick="logout()" id="logout-btn" class="hidden text-xs bg-red-600 px-3 py-1 rounded-lg">Logout</button>
</header>

<main class="p-6 max-w-6xl mx-auto">
<div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</main>

<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-[30px] p-5 flex justify-around items-center nav-card text-white">
<div onclick="openModal('authModal')" class="cursor-pointer text-center">
<span class="block text-xl">👤</span>
<p class="text-[9px] mt-1 opacity-50">Account</p>
</div>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB-7z5W4laDVqgtQNUOrDkAMQU7sHw0NQY",
authDomain: "ghosty-cd076.firebaseapp.com",
projectId: "ghosty-cd076",
storageBucket: "ghosty-cd076.firebasestorage.app",
messagingSenderId: "249795670090",
appId: "1:249795670090:web:c2d119a4d34b089d8076b3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isSignup = true;
let currentUser = null;

/* MODALS */
window.openModal = id => document.getElementById(id).classList.add("active-modal");
window.closeModal = id => document.getElementById(id).classList.remove("active-modal");

/* AUTH */
window.toggleMode = () => {
isSignup = !isSignup;
document.getElementById("auth-title").innerText = isSignup ? "Create Account" : "Login";
document.getElementById("auth-btn").innerText = isSignup ? "Register" : "Login";
document.getElementById("signup-fields").style.display = isSignup ? "block" : "none";
};

window.handleAuth = async () => {
const email = document.getElementById("auth-email").value;
const pass = document.getElementById("auth-pass").value;

try{
if(isSignup){
await createUserWithEmailAndPassword(auth,email,pass);
alert("🎉 Account Created Successfully!");
}else{
await signInWithEmailAndPassword(auth,email,pass);
alert("🔥 Welcome Back!");
}
closeModal("authModal");
}catch(e){
alert("❌ "+e.message);
}
};

window.logout = async () => {
await signOut(auth);
alert("👋 Logged Out Successfully!");
};

onAuthStateChanged(auth,user=>{
currentUser = user;
if(user){
document.getElementById("user-display").innerText="Connected ✅";
document.getElementById("logout-btn").classList.remove("hidden");
}else{
document.getElementById("user-display").innerText="Guest";
document.getElementById("logout-btn").classList.add("hidden");
}
});

/* PRODUCTS (Stable Image Rendering) */
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{
const data = snap.docs.map(d=>({...d.data()}));

document.getElementById("product-grid").innerHTML = data.map(p=>`
<div class="bg-[#111] rounded-3xl border border-[#222] overflow-hidden">
<img src="${p.image || 'https://via.placeholder.com/400'}"
onerror="this.src='https://via.placeholder.com/400'"
class="w-full aspect-square object-cover">
<div class="p-4">
<p class="text-xs uppercase opacity-40">${p.name}</p>
<p class="text-lg font-bold">Rs.${p.price}</p>
</div>
</div>
`).join("");
});

</script>
</body>
</html>
