<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event clouds | PREMIUM STORE 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding-bottom: 100px; }
        .brand-logo { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; color: #fff; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .portal-card { background: #fff; border-radius: 40px; padding: 35px; width: 90%; max-width: 400px; color: #000; }
        .nav-card { background: #111; border-top: 1px solid #222; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; border-radius: 30px; display: flex; justify-content: space-around; padding: 20px; z-index: 100; }
        .step-hidden { display: none; }
        input, textarea { border: 2px solid #eee; border-radius: 15px; padding: 15px; width: 100%; color: #000; font-weight: 600; outline: none; }
        .btn-primary { background: #000; color: #fff; padding: 18px; border-radius: 18px; width: 100%; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="authModal" class="modal">
    <div class="portal-card">
        <h2 class="text-2xl font-black mb-4 uppercase">Account Access</h2>
        <div class="space-y-3">
            <input type="email" id="auth-email" placeholder="EMAIL ADDRESS">
            <input type="password" id="auth-pass" placeholder="PASSWORD">
            <button onclick="handleAuth()" id="auth-btn" class="btn-primary">Continue</button>
            <button onclick="closeModal('authModal')" class="w-full text-xs font-bold opacity-30 mt-4">CANCEL</button>
        </div>
    </div>
</div>

<div id="checkoutModal" class="modal">
    <div class="portal-card">
        <div id="check-step-1">
            <h2 class="text-xl font-black mb-4">ORDER DETAILS</h2>
            <input type="text" id="ord-discord" placeholder="DISCORD ID / USERNAME" class="mb-4">
            <button onclick="nextStep(2)" class="btn-primary">NEXT</button>
        </div>
        <div id="check-step-2" class="step-hidden">
            <h2 class="text-xl font-black mb-2">PAYMENT</h2>
            <p class="text-sm opacity-60 mb-4">Transfer to Easypaisa:</p>
            <div class="bg-gray-100 p-4 rounded-2xl mb-4 text-center">
                <p class="font-black text-2xl">03209797510</p>
                <p class="text-xs font-bold">Sumera Ismail</p>
            </div>
            <button onclick="submitOrder()" class="btn-primary">I HAVE PAID</button>
        </div>
    </div>
</div>

<header class="p-6 flex justify-between items-center">
    <h1 class="brand-logo">Event clouds 👑</h1>
    <div id="user-status" class="text-[10px] font-bold opacity-40 uppercase">Guest</div>
</header>

<main class="p-6">
    <section id="page-home">
        <div id="product-grid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <section id="page-admin" class="hidden">
        <div class="bg-[#111] p-6 rounded-3xl border border-[#222] mb-6">
            <h2 class="font-black mb-4">UPLOAD</h2>
            <div class="space-y-3">
                <input type="text" id="p-name" placeholder="Item Name">
                <input type="number" id="p-price" placeholder="Price">
                <textarea id="p-desc" placeholder="Description"></textarea>
                <input type="file" id="p-file" accept="image/*">
                <button id="p-btn" onclick="handlePublish()" class="bg-white text-black font-bold p-4 rounded-xl w-full">PUBLISH</button>
            </div>
        </div>
        <div id="admin-list" class="space-y-2"></div>
    </section>
</main>

<nav class="nav-card">
    <button onclick="showPage('home')">🏠</button>
    <button onclick="openModal('authModal')">👤</button>
    <button onclick="checkAdminAccess()">🛡️</button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-7z5W4laDVqgtQNUOrDkAMQU7sHw0NQY",
        authDomain: "ghosty-cd076.firebaseapp.com",
        projectId: "ghosty-cd076",
        storageBucket: "ghosty-cd076.firebasestorage.app",
        messagingSenderId: "249795670090",
        appId: "1:249795670090:web:c2d119a4d34b089d8076b3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let user = null;
    let selectedItem = "";

    window.openModal = id => document.getElementById(id).style.display = 'flex';
    window.closeModal = id => document.getElementById(id).style.display = 'none';
    
    window.showPage = id => {
        document.getElementById('page-home').classList.toggle('hidden', id !== 'home');
        document.getElementById('page-admin').classList.toggle('hidden', id !== 'admin');
    };

    // --- Fix: Buy Now Logic ---
    window.openCheckout = (name) => {
        if(!user) {
            alert("Please login first to buy!");
            openModal('authModal');
            return;
        }
        selectedItem = name;
        openModal('checkoutModal');
    };

    window.nextStep = n => {
        document.getElementById('check-step-1').classList.add('step-hidden');
        document.getElementById('check-step-2').classList.remove('step-hidden');
    };

    // --- Fix: Signup/Login Message ---
    window.handleAuth = async () => {
        const e = document.getElementById('auth-email').value;
        const p = document.getElementById('auth-pass').value;
        if(!e || !p) return alert("Fill fields");
        
        try {
            await signInWithEmailAndPassword(auth, e, p);
            alert("Welcome back!");
            closeModal('authModal');
        } catch {
            try {
                await createUserWithEmailAndPassword(auth, e, p);
                alert("Account created successfully!");
                closeModal('authModal');
            } catch (err) { alert(err.message); }
        }
    };

    // --- Fix: Stuck on Saving ---
    window.handlePublish = async () => {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const file = document.getElementById('p-file').files[0];
        const btn = document.getElementById('p-btn');

        if(!name || !file) return alert("Data missing");

        btn.innerText = "UPLOADING IMAGE...";
        btn.disabled = true;

        try {
            const fd = new FormData();
            fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=ed019955ccdfc5952b136e449d727e0b", { method: "POST", body: fd });
            const imgData = await res.json();

            if(imgData.success) {
                btn.innerText = "SAVING TO FIREBASE...";
                // Ensure this matches your rules
                await addDoc(collection(db, "products"), {
                    name, price, image: imgData.data.url, createdAt: serverTimestamp()
                });
                alert("Product Published!");
                location.reload();
            } else {
                alert("ImgBB Upload Failed");
            }
        } catch (e) {
            alert("Firebase Error: Check your Database Rules!");
            console.error(e);
        } finally {
            btn.innerText = "PUBLISH";
            btn.disabled = false;
        }
    };

    // Display Products
    onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
        const items = snap.docs.map(d => ({id: d.id, ...d.data()}));
        document.getElementById('product-grid').innerHTML = items.map(i => `
            <div class="bg-[#111] rounded-3xl border border-[#222] overflow-hidden">
                <img src="${i.image}" class="w-full aspect-square object-cover">
                <div class="p-4">
                    <p class="text-xs font-bold opacity-50">${i.name}</p>
                    <p class="text-xl font-black">Rs.${i.price}</p>
                    <button onclick="openCheckout('${i.name}')" class="w-full bg-white text-black py-2 rounded-xl mt-2 font-bold text-xs uppercase">Buy Now</button>
                </div>
            </div>
        `).join('');
    });

    window.submitOrder = async () => {
        const discord = document.getElementById('ord-discord').value;
        await addDoc(collection(db, "orders"), {
            item: selectedItem,
            discord,
            user: user.email,
            timestamp: serverTimestamp()
        });
        window.open(`https://wa.me/923706116030?text=Order:${selectedItem},Discord:${discord}`, "_blank");
        closeModal('checkoutModal');
    };

    window.checkAdminAccess = () => {
        const key = prompt("Enter Staff Key:");
        if(key === "GHOSTYDEVELOPER") showPage('admin');
        else alert("Wrong Key");
    };

    onAuthStateChanged(auth, u => { 
        user = u; 
        document.getElementById('user-status').innerText = u ? u.email.split('@')[0] : "Guest";
    });
</script>
</body>
</html>
